services:

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - api_server

  frontend:
    build:
      context: ./frontend/
      dockerfile: Dockerfile
    container_name: frontend
    restart: always
    expose:
      - "80"

  api_server:
    build: 
      context: ./api_server/
      dockerfile: Dockerfile
    container_name: api_server
    restart: always
    secrets:
      - db_password
      - redis_password
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=usern
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password

      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=usern
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_NAME=db
      - DB_SSLMODE=disable

      - SERVER_PORT=8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  watcher:
    build:
      context: ./worker/
      dockerfile: Dockerfile
    container_name: watcher
    restart: always
    secrets:
      - redis_password
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_USERNAME=usern
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
    depends_on:
      redis:
        condition: service_healthy

  postgres:
    image: postgres:latest
    container_name: postgres_db
    restart: always
    expose:
      - "5432"
    secrets:
      - db_password
    environment:
      - POSTGRES_PASSWORD_FILE=/run/secrets/db_password
      - POSTGRES_USER=usern
      - POSTGRES_DB=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:latest
    container_name: redis_db
    restart: always
    expose:
      - "6379"
    volumes:
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt